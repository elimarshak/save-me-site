name: style
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build the style bundle
        run: |
          npm init -y > /dev/null
          npm i @protomaps/basemaps
          node gen-style.mjs
          git clone --depth 1 https://github.com/protomaps/basemaps-assets ba
          mkdir -p assets/sprites/v4 assets/fonts
          cp ba/sprites/v4/light* assets/sprites/v4/
          # Every glyph range of every font the style uses. The map on the phone stops drawing all the labels of a
          # tile when one range it asks for is missing, and Arabic names ask for the ranges near the end (65024-65279).
          for f in "Noto Sans Regular" "Noto Sans Medium" "Noto Sans Italic" "Noto Sans Devanagari Regular v1"; do
            enc=$(echo "$f" | sed 's/ /%20/g')
            for d in "$f" "$enc"; do
              mkdir -p "assets/fonts/$d"
              cp "ba/fonts/$f/"*.pbf "assets/fonts/$d/"
            done
            n=$(ls "assets/fonts/$f" | wc -l)
            echo "$f: $n ranges"
            test "$n" -ge 256
          done
          cp style.json assets/
          (cd assets && zip -qr ../assets.zip .)
          ls -la assets.zip
      - name: add it to the maps release under a new name
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STAMP=$(date -u +%Y%m%d%H%M)
          NAME="assets-$STAMP.zip"
          cp assets.zip "$NAME"
          gh release upload maps "$NAME"
          curl -sSL -o maps.json https://github.com/elimarshak/save-me-site/releases/download/maps/maps.json
          NAME="$NAME" STAMP="$STAMP" python3 -c "import json,os;d=json.load(open('maps.json'));d['assets']=os.path.getsize('assets.zip');d['assets_file']=os.environ['NAME'];d['assets_build']=os.environ['STAMP'];json.dump(d,open('maps.json','w'))"
          cat maps.json
          gh release upload maps maps.json --clobber
