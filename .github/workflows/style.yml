name: style
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build the style bundle
        run: |
          npm init -y > /dev/null
          npm i @protomaps/basemaps
          node gen-style.mjs
          git clone --depth 1 https://github.com/protomaps/basemaps-assets ba
          mkdir -p assets/sprites/v4
          cp ba/sprites/v4/light* assets/sprites/v4/
          for f in "Noto Sans Regular" "Noto Sans Medium" "Noto Sans Italic"; do
            enc=$(echo "$f" | sed 's/ /%20/g')
            for d in "$f" "$enc"; do
              mkdir -p "assets/fonts/$d"
              for r in 0-255 256-511 512-767 768-1023 1024-1279 1280-1535 1536-1791 1792-2047 8192-8447 8448-8703 8704-8959; do
                cp "ba/fonts/$f/$r.pbf" "assets/fonts/$d/" 2>/dev/null || true
              done
            done
          done
          cp style.json assets/
          (cd assets && zip -qr ../assets.zip .)
          ls -la assets.zip
      - name: replace it inside the maps release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload maps assets.zip --clobber
          curl -sSL -o maps.json https://github.com/elimarshak/save-me-site/releases/download/maps/maps.json
          python3 -c "import json,os;d=json.load(open('maps.json'));d['assets']=os.path.getsize('assets.zip');json.dump(d,open('maps.json','w'))"
          cat maps.json
          gh release upload maps maps.json --clobber
